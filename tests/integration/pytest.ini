[tool:pytest]
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=tests/integration/reports/report.html
    --self-contained-html
markers =
    health: Health check tests
    device: Device service tests
    telemetry: Telemetry service tests
    smart_home: Smart home service tests
    temperature: Temperature API tests
    integration: Cross-service integration tests
    slow: Slow running tests
